<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>정보 AI 학습 플랫폼</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    :root {
      --color-pre:    #0D9488;
      --color-mid:    #065A82;
      --color-post:   #1E2761;
      --color-ink:    #1E293B;
      --color-gray:   #64748B;
      --color-light:  #F1F5F9;
      --color-border: #E2E8F0;
      --color-white:  #FFFFFF;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Pretendard', 'Apple SD Gothic Neo', '맑은 고딕', sans-serif;
      background: linear-gradient(135deg, #EFF6FF 0%, #F0FDF9 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── 헤더 ── */
    .landing-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 48px;
      background: var(--color-white);
      border-bottom: 1px solid var(--color-border);
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 800;
      color: var(--color-mid);
      text-decoration: none;
    }

    .brand-badge {
      background: var(--color-mid);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 5px;
      letter-spacing: 0.03em;
    }

    .header-notice {
      font-size: 13px;
      color: var(--color-gray);
    }

    /* ── 메인 ── */
    .landing-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
    }

    .landing-hero {
      text-align: center;
      margin-bottom: 56px;
    }

    .landing-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(6,90,130,0.08);
      color: var(--color-mid);
      font-size: 12px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 20px;
      letter-spacing: 0.04em;
    }

    .landing-title {
      font-size: 42px;
      font-weight: 800;
      color: var(--color-ink);
      line-height: 1.2;
      margin-bottom: 16px;
    }

    .landing-title em {
      color: var(--color-mid);
      font-style: normal;
    }

    .landing-desc {
      font-size: 17px;
      color: var(--color-gray);
      line-height: 1.7;
    }

    /* ── 선택 카드 ── */
    .mode-cards {
      display: flex;
      gap: 28px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .mode-card {
      background: var(--color-white);
      border: 2px solid var(--color-border);
      border-radius: 20px;
      padding: 44px 48px;
      width: 300px;
      text-align: center;
      cursor: pointer;
      text-decoration: none;
      color: var(--color-ink);
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .mode-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0,0,0,0.12);
    }

    .mode-card.teacher:hover { border-color: var(--color-mid); }
    .mode-card.student:hover { border-color: var(--color-pre); }

    .mode-icon {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }

    .mode-card.teacher .mode-icon { background: rgba(6,90,130,0.1); }
    .mode-card.student .mode-icon { background: rgba(13,148,136,0.1); }

    .mode-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--color-ink);
    }

    .mode-desc {
      font-size: 14px;
      color: var(--color-gray);
      line-height: 1.6;
    }

    .mode-btn {
      margin-top: 8px;
      width: 100%;
      padding: 13px 0;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: opacity 0.15s;
      font-family: inherit;
    }

    .mode-btn:hover { opacity: 0.88; }
    .mode-card.teacher .mode-btn { background: var(--color-mid); }
    .mode-card.student .mode-btn  { background: var(--color-pre); }

    /* ── 하단 ── */
    .landing-footer {
      text-align: center;
      padding: 24px;
      font-size: 12px;
      color: var(--color-gray);
    }
  </style>
</head>
<body>

<header class="landing-header">
  <div class="brand">
    <span class="brand-badge">AI</span>
    정보 AI 학습 플랫폼
  </div>
  <span class="header-notice">중·고등 정보 교과 특화 AI 코스웨어</span>
</header>

<main class="landing-main">

  <div class="landing-hero">
    <div class="landing-tag">✦ 정보 교과 특화 AI 학습</div>
    <h1 class="landing-title">
      AI와 함께하는<br><em>정보 교과 학습</em>
    </h1>
    <p class="landing-desc">
      수업 설계부터 실습 채점까지 — 교사와 학생 모두를 위한<br>
      AI 정보 코스웨어 플랫폼
    </p>
  </div>

  <div class="mode-cards">

    <a href="teacher_home.html" class="mode-card teacher" aria-label="선생님 모드로 시작">
      <div class="mode-icon">👩‍🏫</div>
      <div class="mode-title">선생님</div>
      <div class="mode-desc">
        수업 설계, 실시간 모니터링,<br>
        AI 채점 및 학습 결과 분석
      </div>
      <button class="mode-btn" tabindex="-1">입장하기</button>
    </a>

    <a href="wfs02_dashboard.html" class="mode-card student" aria-label="학생 모드로 시작">
      <div class="mode-icon">👨‍🎓</div>
      <div class="mode-title">학생</div>
      <div class="mode-desc">
        수업 학습, 엔트리·파이썬 실습,<br>
        AI 피드백 및 성장 확인
      </div>
      <button class="mode-btn" tabindex="-1">입장하기</button>
    </a>

  </div>

</main>

<footer class="landing-footer">
  © 2026 정보 AI 학습 플랫폼 · 중·고등 정보 교과 AI 코스웨어
</footer>

</body>
</html>
